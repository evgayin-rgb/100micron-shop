  <style>
    :root {
      --bg-primary: #11161d;
      --bg-secondary: #1a222d;
      --bg-elevated: #243040;
      --bg-input: #151c25;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);

      --ozon-blue: #005bff;
      --ozon-blue-hover: #004ed6;
      --ozon-green: #10c44c;
      --ozon-pink: #f91155;
      --ozon-wow: #7c3aed;
      --photo-bg: #ffffff;
      --sheet-backdrop: rgba(8, 12, 18, 0.74);
      --tg-bubble-bg: #1e2c3a;
    }

    [data-theme="light"] {
      --bg-primary: #f2f4f7;
      --bg-secondary: #ffffff;
      --bg-elevated: #e8edf3;
      --bg-input: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: rgba(15, 23, 42, 0.08);

      --ozon-blue: #005bff;
      --ozon-blue-hover: #004ed6;
      --ozon-green: #0ea340;
      --ozon-pink: #f91155;
      --ozon-wow: #6d28d9;
      --photo-bg: #f8fafc;
      --sheet-backdrop: rgba(15, 23, 42, 0.55);
      --tg-bubble-bg: #e7f3ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .bg-app { background-color: var(--bg-primary); }
    .bg-card { background-color: var(--bg-secondary); }
    .bg-elevated { background-color: var(--bg-elevated); }
    .bg-input { background-color: var(--bg-input); }
    .text-main { color: var(--text-primary); }
    .text-muted { color: var(--text-secondary); }
    .border-app { border-color: var(--border-color); }

    .bg-ozon-blue { background-color: var(--ozon-blue); }
    .bg-ozon-blue:hover { background-color: var(--ozon-blue-hover); }
    .text-ozon-green { color: var(--ozon-green); }
    .bg-ozon-pink { background-color: var(--ozon-pink); }
    .bg-ozon-wow { background-color: var(--ozon-wow); }
    .bg-tg-bubble { background-color: var(--tg-bubble-bg); }

    /* Вертикальный контейнер фото 3:4 как на Ozon */
    .product-photo-wrap {
      aspect-ratio: 3 / 4;
      width: 100%;
      background-color: var(--photo-bg);
      position: relative;
      overflow: hidden;
    }

    .product-photo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.25s ease;
    }

    .product-card:active .product-photo-img {
      transform: scale(1.02);
    }

    /* Обрезка названия до 2 строк */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Скрытие скроллбаров в горизонтальных лентах */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Скелетон загрузки */
    @keyframes shimmer {
      0% { opacity: 0.45; }
      50% { opacity: 0.85; }
      100% { opacity: 0.45; }
    }
    .skeleton-pulse {
      animation: shimmer 1.4s ease-in-out infinite;
    }

    /* Bottom Sheet анимации */
    .sheet-backdrop {
      background-color: var(--sheet-backdrop);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-panel {
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sheet-backdrop.open .sheet-panel {
      transform: translateY(0);
    }

    /* Toast */
    .toast {
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.24s ease;
    }
    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }
  </style>
</head>

    // =========================================================================
    // 3. УТИЛИТЫ
    // =========================================================================
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatPrice(num) {
      const n = Number(num) || 0;
      return n.toLocaleString('ru-RU') + ' ₽';
    }

    function getDiscountPercent(price, oldPrice) {
      if (!oldPrice || oldPrice <= price) return 0;
      return Math.round(((oldPrice - price) / oldPrice) * 100);
    }

    function getPlaceholderUrl(label) {
      const shortText = encodeURIComponent(String(label || '100micron').slice(0, 22));
      return `https://placehold.co/600x800/f1f5f9/334155?text=${shortText}`;
    }

    function parseNumber(val) {
      if (val === null || val === undefined) return 0;
      const cleaned = String(val).replace(/[^\d.,-]/g, '').replace(',', '.');
      const parsed = parseFloat(cleaned);
      return Number.isFinite(parsed) ? Math.round(parsed) : 0;
    }

    function parseImages(raw, fallbackLabel) {
      if (!raw) return [getPlaceholderUrl(fallbackLabel)];
      const urls = String(raw)
        .split(/[\n,|;]+/)
        .map(s => s.trim())
        .filter(s => /^https?:\/\//i.test(s));
      return urls.length > 0 ? urls : [getPlaceholderUrl(fallbackLabel)];
    }

    function haptic(type = 'light') {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === 'success' || type === 'error' || type === 'warning') {
            tg.HapticFeedback.notificationOccurred(type);
          } else {
            tg.HapticFeedback.impactOccurred(type);
          }
        }
      } catch (_) {}
    }

      clearTimeout(toastTimer);

    function pluralizeItems(count) {
      const mod10 = count % 10;
      const mod100 = count % 100;
      if (mod10 === 1 && mod100 !== 11) return `${count} товар`;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return `${count} товара`;
      return `${count} товаров`;
    }

    // =========================================================================
    // 4. ПАРСЕР CSV ИЗ GOOGLE ТАБЛИЦЫ
    // =========================================================================
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(field);
            field = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
          } else {
            field += ch;
          }
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }
      return rows;
    }

    async function loadCatalogFromCSV(manualRefresh = false) {
      state.catalogSource = 'loading';
      renderCatalogStatus();
      renderSkeletons();

      try {
        const cacheBuster = (CONFIG.CSV_URL.includes('?') ? '&' : '?') + '_t=' + Date.now();
        const res = await fetch(CONFIG.CSV_URL + cacheBuster, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const csvText = await res.text();
        const rows = parseCSV(csvText).filter(r => r.some(cell => String(cell).trim() !== ''));

        if (rows.length < 2) {
          throw new Error('В таблице пока нет заполненных строк с товарами');
        }

        const headers = rows[0].map(h => String(h).trim().toLowerCase());
        const idx = (name) => headers.indexOf(name);

        const iId = idx('id');
        const iName = idx('name');
        const iBrand = idx('brand');
        const iCategory = idx('category');
        const iPrice = idx('price');
        const iOldPrice = idx('old_price');
        const iBadge = idx('badge');
        const iImage = idx('image_url');
        const iDesc = idx('description');
        const iStock = idx('in_stock');

        const parsed = [];
        for (let r = 1; r < rows.length; r++) {
          const cols = rows[r];
          const get = (colIdx) => (colIdx >= 0 && colIdx < cols.length ? String(cols[colIdx]).trim() : '');

          const name = get(iName);
          if (!name) continue;

          const stockRaw = get(iStock);
          let inStock = 10;
          if (stockRaw !== '') {
            const lowerStock = stockRaw.toLowerCase();
            if (lowerStock === 'нет' || lowerStock === 'false' || lowerStock === '0') {
              inStock = 0;
            } else {
              const numStock = parseNumber(stockRaw);
              inStock = numStock;
            }
          }
          // Скрываем товары с нулевым остатком
          if (inStock <= 0) continue;

          const price = parseNumber(get(iPrice));
          const oldPrice = parseNumber(get(iOldPrice));
          const id = get(iId) || `SKU-${r}`;

          parsed.push({
            id,
            name,
            brand: get(iBrand) || '100micron',
            category: get(iCategory) || 'Автосканеры',
            price,
            oldPrice: oldPrice > price ? oldPrice : 0,
            badge: get(iBadge),
            images: parseImages(get(iImage), name),
            description: get(iDesc) || 'Оригинальное диагностическое оборудование от магазина 100micron.',
            inStock
          });
        }

        if (parsed.length === 0) {
          throw new Error('Нет товаров в наличии');
        }

        state.products = parsed;
        state.catalogSource = 'sheets';
        if (manualRefresh) showToast('Каталог обновлён из Google Таблицы');
      } catch (err) {
        console.warn('CSV load fallback:', err);
        state.products = FALLBACK_PRODUCTS.slice();
        state.catalogSource = 'fallback';
        if (manualRefresh) showToast('Не удалось загрузить таблицу — показан демо-каталог');
      }

      renderCatalogStatus();
      renderFilters();
      renderProducts();
      updateCartUI();
    }

        if (q) {
          const hay = `${p.name} ${p.brand} ${p.category} ${p.id} ${p.description}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;

                  data-add-cart="${escapeHtml(p.id)}"
                  class="w-full py-2.5 rounded-xl bg-ozon-blue text-white text-xs font-bold active:scale-95 transition"
                >
                  В корзину
                </button>
              ` : `
                <div class="w-full flex items-center justify-between rounded-xl bg-elevated p-1">
                  <button
                    type="button"
                    data-dec-cart="${escapeHtml(p.id)}"
                    class="w-8 h-8 rounded-lg bg-card text-main font-bold text-sm flex items-center justify-center active:scale-95 transition"
                    aria-label="Уменьшить"
                  >−</button>
                  <span class="text-xs font-extrabold text-main">${qty} шт</span>
                  <button
                    type="button"
                    data-inc-cart="${escapeHtml(p.id)}"
                    class="w-8 h-8 rounded-lg bg-ozon-blue text-white font-bold text-sm flex items-center justify-center active:scale-95 transition"
                    aria-label="Увеличить"
                  >+</button>
                </div>
              `}
            </div>
          </article>
        `;
      }).join('');
    }

    // =========================================================================
    // 6. КАРТОЧКА ТОВАРА С КАРУСЕЛЬЮ ФОТО
    // =========================================================================
    function openProductModal(productId) {
      const product = findProductById(productId);
      if (!product) return;

      state.activeProductId = productId;
      state.activeGalleryIndex = 0;
      renderProductModal();
      els.productModal.classList.add('open');
      document.body.style.overflow = 'hidden';
      haptic('light');
    }

    function closeProductModal() {
      els.productModal.classList.remove('open');
      state.activeProductId = null;
      if (!els.cartModal.classList.contains('open')) {
        document.body.style.overflow = '';
      }
    }

    function renderProductModal() {
      const p = findProductById(state.activeProductId);
      if (!p) return;

      const qty = state.cart[p.id] || 0;
      const discount = getDiscountPercent(p.price, p.oldPrice);
      const currentImg = p.images[state.activeGalleryIndex] || p.images[0] || getPlaceholderUrl(p.name);
      const fallbackImg = getPlaceholderUrl(p.name);

      els.productModalBody.innerHTML = `
        <!-- Галерея -->
        <div class="space-y-2.5">
          <div id="galleryStage" class="relative w-full aspect-[4/4] sm:aspect-[4/3] rounded-2xl bg-white overflow-hidden select-none">
            <img
              src="${escapeHtml(currentImg)}"
              alt="${escapeHtml(p.name)}"
              referrerpolicy="no-referrer"
              onerror="this.onerror=null;this.src='${escapeHtml(fallbackImg)}';"
              class="w-full h-full object-contain"
            />
            ${p.images.length > 1 ? `
              <button
                type="button"
                id="galleryPrevBtn"
                class="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/55 text-white flex items-center justify-center text-lg active:scale-90 transition"
                aria-label="Предыдущее фото"
              >‹</button>
              <button
                type="button"
                id="galleryNextBtn"
                class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/55 text-white flex items-center justify-center text-lg active:scale-90 transition"
                aria-label="Следующее фото"
              >›</button>
              <span class="absolute bottom-2.5 right-2.5 px-2 py-0.5 rounded-full bg-black/60 text-white text-[11px] font-semibold">
                ${state.activeGalleryIndex + 1} / ${p.images.length}
              </span>
            ` : ''}
          </div>

          ${p.images.length > 1 ? `
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5">
              ${p.images.map((url, idx) => `
                <button
                  type="button"
                  data-gallery-idx="${idx}"
                  class="w-14 h-16 rounded-xl bg-white overflow-hidden shrink-0 border-2 transition ${
                    idx === state.activeGalleryIndex ? 'border-[#005bff]' : 'border-transparent opacity-65'
                  }"
                >
                  <img
                    src="${escapeHtml(url)}"
                    alt="Фото ${idx + 1}"
                    referrerpolicy="no-referrer"
                    onerror="this.onerror=null;this.src='${escapeHtml(fallbackImg)}';"
                    class="w-full h-full object-contain"
                  />
                </button>
              `).join('')}
            </div>
          ` : ''}
        </div>

        <!-- Цены и мета -->
        <div class="space-y-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-2xl font-extrabold text-ozon-green">${formatPrice(p.price)}</span>
            ${p.oldPrice > p.price ? `<span class="text-sm text-muted line-through">${formatPrice(p.oldPrice)}</span>` : ''}
            ${discount > 0 ? `<span class="px-2 py-0.5 rounded-lg bg-ozon-pink text-white text-xs font-bold">-${discount}%</span>` : ''}
          </div>

          <div class="flex items-center gap-2 text-xs text-muted flex-wrap">
            <span class="px-2 py-0.5 rounded-md bg-elevated text-main font-semibold">${escapeHtml(p.brand)}</span>
            <span>${escapeHtml(p.category)}</span>
            <span>·</span>
            <span>SKU: ${escapeHtml(p.id)}</span>
          </div>

          <h2 class="text-base font-bold text-main leading-snug">${escapeHtml(p.name)}</h2>
          <p class="text-xs text-emerald-400 font-medium">В наличии: ${p.inStock} шт.</p>
        </div>

        <!-- Описание -->
        <div class="p-3.5 rounded-2xl bg-input border border-app">
          <h4 class="text-xs font-bold text-main uppercase tracking-wider mb-1.5">Описание и характеристики</h4>
          <p class="text-xs text-muted leading-relaxed whitespace-pre-line">${escapeHtml(p.description)}</p>
        </div>
      `;

      els.productModalFooter.innerHTML = qty === 0 ? `
        <button
          type="button"
          data-modal-add="${escapeHtml(p.id)}"
          class="w-full py-3.5 rounded-2xl bg-ozon-blue text-white font-bold text-sm active:scale-[0.98] transition shadow-lg shadow-blue-600/25"
        >
          Добавить в корзину · ${formatPrice(p.price)}
        </button>
      ` : `
        <div class="flex items-center gap-2.5">
          <div class="flex items-center justify-between rounded-2xl bg-elevated p-1.5 w-36 shrink-0">
            <button
              type="button"
              data-modal-dec="${escapeHtml(p.id)}"
              class="w-9 h-9 rounded-xl bg-card text-main font-bold text-base flex items-center justify-center active:scale-95"
            >−</button>
            <span class="text-sm font-extrabold text-main">${qty}</span>
            <button
              type="button"
              data-modal-inc="${escapeHtml(p.id)}"
              class="w-9 h-9 rounded-xl bg-ozon-blue text-white font-bold text-base flex items-center justify-center active:scale-95"
            >+</button>
          </div>
          <button
            type="button"
            id="modalGoCartBtn"
            class="flex-1 py-3.5 rounded-2xl bg-ozon-blue text-white font-bold text-sm active:scale-[0.98] transition"
          >
            В корзину · ${formatPrice(p.price * qty)}
          </button>
        </div>
      `;

      // События галереи и свайп
      const prevBtn = document.getElementById('galleryPrevBtn');
      const nextBtn = document.getElementById('galleryNextBtn');
      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          state.activeGalleryIndex = (state.activeGalleryIndex - 1 + p.images.length) % p.images.length;
          renderProductModal();
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          state.activeGalleryIndex = (state.activeGalleryIndex + 1) % p.images.length;
          renderProductModal();
        });
      }

      els.productModalBody.querySelectorAll('[data-gallery-idx]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeGalleryIndex = Number(btn.dataset.galleryIdx) || 0;
          renderProductModal();
        });
      });

      // Поддержка свайпа пальцем по фото
      const stage = document.getElementById('galleryStage');
      if (stage && p.images.length > 1) {
        let touchStartX = 0;
        stage.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].clientX;
        }, { passive: true });
        stage.addEventListener('touchend', (e) => {
          const dx = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(dx) > 40) {
            if (dx < 0) {
              state.activeGalleryIndex = (state.activeGalleryIndex + 1) % p.images.length;
            } else {
              state.activeGalleryIndex = (state.activeGalleryIndex - 1 + p.images.length) % p.images.length;
            }
            renderProductModal();
          }
        }, { passive: true });
      }
    }

    // =========================================================================
    // 7. КОРЗИНА И ОФОРМЛЕНИЕ ЗАКАЗА
    // =========================================================================
    function getCartItems() {
      const items = [];
      for (const [id, qty] of Object.entries(state.cart)) {
        if (qty <= 0) continue;
        const p = findProductById(id);
        if (p) {
          items.push({
            id: p.id,
            name: p.name,
            brand: p.brand,
            price: p.price,
            image: p.images[0] || getPlaceholderUrl(p.name),
            qty,
            sum: p.price * qty
          });
        }
      }
      return items;
    }

    function getCartSummary() {
      const items = getCartItems();
      const totalQty = items.reduce((acc, i) => acc + i.qty, 0);
      const total = items.reduce((acc, i) => acc + i.sum, 0);
      return { items, totalQty, total };
    }

    function syncCheckoutInputsToState() {
      const nameEl = document.getElementById('inputName');
      const phoneEl = document.getElementById('inputPhone');
      const deliveryEl = document.getElementById('inputDelivery');
      const commentEl = document.getElementById('inputComment');
      if (nameEl) state.customer.name = nameEl.value;
      if (phoneEl) state.customer.phone = phoneEl.value;
      if (deliveryEl) state.customer.delivery = deliveryEl.value;
      if (commentEl) state.customer.comment = commentEl.value;
    }

    function updateCartQty(productId, delta) {
      const p = findProductById(productId);
      if (!p) return;

      if (els.cartModal.classList.contains('open') && state.cartStep === 'checkout') {
        syncCheckoutInputsToState();
      }

      const current = state.cart[p.id] || 0;
      const next = Math.max(0, Math.min(p.inStock || 99, current + delta));

      if (next === 0) {
        delete state.cart[p.id];
      } else {
        state.cart[p.id] = next;
      }

      haptic(delta > 0 ? 'light' : 'soft');
      renderProducts();
      if (state.activeProductId === p.id) {
        renderProductModal();
      }
      updateCartUI();
      if (els.cartModal.classList.contains('open') && (state.cartStep === 'cart' || state.cartStep === 'checkout')) {
        renderCartModal();
      }
    }

    function updateCartUI() {
      const { totalQty, total } = getCartSummary();

      if (totalQty > 0) {
        els.headerCartBadge.textContent = String(totalQty);
        els.headerCartBadge.classList.remove('hidden');
        els.barItemCount.textContent = String(totalQty);
        els.barTotalPrice.textContent = formatPrice(total);
        els.stickyCheckoutBar.classList.remove('translate-y-full');
      } else {
        els.headerCartBadge.classList.add('hidden');
        els.stickyCheckoutBar.classList.add('translate-y-full');
      }

      // Нативная кнопка Telegram MainButton (если открыто внутри Telegram)
      if (tg && tg.MainButton) {
        if (totalQty > 0 && !els.cartModal.classList.contains('open')) {
          tg.MainButton.setText(`Оформить заказ · ${formatPrice(total)}`);
          tg.MainButton.show();
        } else {
          tg.MainButton.hide();
        }
      }
    }

    function openCartModal(step = 'cart') {
      state.cartStep = step;
      renderCartModal();
      els.cartModal.classList.add('open');
      document.body.style.overflow = 'hidden';
      updateCartUI();
      haptic('light');
    }

    function closeCartModal() {
      els.cartModal.classList.remove('open');
      if (!els.productModal.classList.contains('open')) {
        document.body.style.overflow = '';
      }
      updateCartUI();
    }

    function renderCartModal() {
      const { items, totalQty, total } = getCartSummary();

      if (state.cartStep === 'success' && state.lastOrder) {
        els.cartModalTitle.textContent = `Заказ #${state.lastOrder.orderId}`;
        els.cartModalSubtitle.textContent = state.lastOrder.statusText;
        els.cartModalBody.innerHTML = `
          <div class="text-center py-2">
            <div class="w-14 h-14 mx-auto rounded-full bg-emerald-500/15 text-emerald-400 flex items-center justify-center text-2xl font-bold mb-2">✓</div>
            <h3 class="text-base font-bold text-main">Заявка сформирована</h3>
            <p class="text-xs text-muted mt-1">${escapeHtml(state.lastOrder.statusText)}</p>
          </div>

          <div class="p-3.5 rounded-2xl bg-tg-bubble border border-app">
            <p class="text-[11px] font-bold text-muted uppercase tracking-wider mb-2">Сообщение для Telegram-группы</p>
            <pre class="text-xs text-main whitespace-pre-wrap font-sans leading-relaxed m-0">${escapeHtml(state.lastOrder.formattedMessage)}</pre>
          </div>

          <button
            type="button"
            id="finishSuccessBtn"
            class="w-full py-3.5 rounded-2xl bg-ozon-blue text-white font-bold text-sm active:scale-[0.98] transition"
          >
            Вернуться в каталог
          </button>
        `;
        const finishBtn = document.getElementById('finishSuccessBtn');
        if (finishBtn) {
          finishBtn.addEventListener('click', () => {
            closeCartModal();
          });
        }

      }

      if (items.length === 0) {
        els.cartModalTitle.textContent = 'Корзина пуста';
        els.cartModalSubtitle.textContent = 'Добавьте товары из каталога';
        els.cartModalBody.innerHTML = `
          <div class="py-10 text-center space-y-3">
            <p class="text-sm font-semibold text-main">В корзине пока нет товаров</p>
            <button
              type="button"
              id="emptyCartBackBtn"
              class="px-5 py-2.5 rounded-xl bg-ozon-blue text-white text-xs font-bold"
            >
              Перейти к каталогу
            </button>
          </div>
        `;
        const backBtn = document.getElementById('emptyCartBackBtn');
        if (backBtn) backBtn.addEventListener('click', closeCartModal);
        return;
      }

      if (state.cartStep === 'cart') {
        els.cartModalTitle.textContent = `Корзина (${totalQty})`;
        els.cartModalSubtitle.textContent = `Сумма: ${formatPrice(total)}`;

        els.cartModalBody.innerHTML = `
          <div class="space-y-2.5">
            ${items.map(item => `
              <div class="flex items-center gap-3 p-2.5 rounded-2xl bg-input border border-app">
                <img
                  src="${escapeHtml(item.image)}"
                  alt="${escapeHtml(item.name)}"
                  referrerpolicy="no-referrer"
                  onerror="this.onerror=null;this.src='${escapeHtml(getPlaceholderUrl(item.name))}';"
                  class="w-14 h-16 rounded-xl bg-white object-contain shrink-0"
                />
                <div class="flex-1 min-w-0">
                  <p class="text-xs font-semibold text-main line-clamp-2">${escapeHtml(item.name)}</p>
                  <p class="text-[11px] text-muted mt-0.5">SKU: ${escapeHtml(item.id)}</p>
                  <div class="flex items-center justify-between mt-2">
                    <span class="text-sm font-extrabold text-ozon-green">${formatPrice(item.sum)}</span>
                    <div class="flex items-center gap-1.5 bg-elevated rounded-xl p-0.5">
                      <button type="button" data-cart-dec="${escapeHtml(item.id)}" class="w-7 h-7 rounded-lg bg-card text-main font-bold text-sm">−</button>
                      <span class="text-xs font-bold text-main w-5 text-center">${item.qty}</span>
                      <button type="button" data-cart-inc="${escapeHtml(item.id)}" class="w-7 h-7 rounded-lg bg-ozon-blue text-white font-bold text-sm">+</button>
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          ${renderUpsellCard(false)}

          <div class="p-3.5 rounded-2xl bg-input border border-app flex items-center justify-between">
            <span class="text-sm text-muted">Итого к оплате</span>
            <span class="text-lg font-extrabold text-main">${formatPrice(total)}</span>
          </div>

          <button
            type="button"
            id="proceedCheckoutBtn"
            class="w-full py-3.5 rounded-2xl bg-ozon-blue text-white font-bold text-sm active:scale-[0.98] transition shadow-lg shadow-blue-600/25"
          >
            Перейти к оформлению · ${formatPrice(total)}
          </button>
        `;

        const proceedBtn = document.getElementById('proceedCheckoutBtn');
        if (proceedBtn) {
          proceedBtn.addEventListener('click', () => {
            state.cartStep = 'checkout';
            renderCartModal();
          });
        }
        return;
      }

      // Шаг оформления заказа (checkout)
      els.cartModalTitle.textContent = 'Оформление заказа';
      els.cartModalSubtitle.textContent = `${pluralizeItems(totalQty)} на сумму ${formatPrice(total)}`;

      const deliveries = [
        'СДЭК (пункт выдачи)',
        'Почта России',
        'Курьер по городу',
        'Самовывоз'
      ];

      els.cartModalBody.innerHTML = `
        <form id="checkoutForm" class="space-y-3">
          ${renderUpsellCard(true)}

          <div>
            <label class="block text-xs font-semibold text-muted mb-1">Ваше имя *</label>
            <input
              id="inputName"
              type="text"
              required
              value="${escapeHtml(state.customer.name)}"
              placeholder="Например, Алексей"
              class="w-full px-3.5 py-2.5 rounded-xl bg-input border border-app text-sm text-main focus:outline-none focus:border-[#005bff]"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-muted mb-1">Телефон для связи *</label>
            <input
              id="inputPhone"
              type="tel"
              required
              value="${escapeHtml(state.customer.phone)}"
              placeholder="+7 (999) 123-45-67"
              class="w-full px-3.5 py-2.5 rounded-xl bg-input border border-app text-sm text-main focus:outline-none focus:border-[#005bff]"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-muted mb-1">Способ доставки</label>
            <select
              id="inputDelivery"
              class="w-full px-3.5 py-2.5 rounded-xl bg-input border border-app text-sm text-main focus:outline-none focus:border-[#005bff]"
            >
              ${deliveries.map(d => `<option value="${escapeHtml(d)}" ${state.customer.delivery === d ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-muted mb-1">Комментарий (адрес ПВЗ, марка авто)</label>
            <textarea
              id="inputComment"
              rows="2"
              placeholder="Город, адрес пункта выдачи или вопрос по совместимости..."
              class="w-full px-3.5 py-2.5 rounded-xl bg-input border border-app text-sm text-main focus:outline-none focus:border-[#005bff] resize-none"
            >${escapeHtml(state.customer.comment)}</textarea>
          </div>

          <div id="checkoutError" class="hidden text-xs text-rose-400 font-medium"></div>

          <div class="flex items-center gap-2 pt-1">
            <button
              type="button"
              id="backToCartBtn"
              class="px-4 py-3.5 rounded-2xl bg-elevated text-main text-xs font-bold active:scale-95 transition"
            >
              Назад
            </button>
            <button
              type="submit"
              id="submitOrderBtn"
              ${state.submitting ? 'disabled' : ''}
              class="flex-1 py-3.5 rounded-2xl bg-ozon-blue text-white font-bold text-sm active:scale-[0.98] transition disabled:opacity-60"
            >
              ${state.submitting ? 'Отправка заказа...' : `Подтвердить заказ · ${formatPrice(total)}`}
            </button>
          </div>
        </form>
      `;

      document.getElementById('backToCartBtn')?.addEventListener('click', () => {
        syncCheckoutInputsToState();

        renderCartModal();
      });

      document.getElementById('checkoutForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        submitOrder();
      });
    }

    function buildFormattedTelegramMessage(payload) {
      const tgUser = payload.customer.tgUser;
      const lines = [
        `🛒 Новый заказ #${payload.orderId}`,
        `Магазин: ${CONFIG.STORE_NAME}`,
        '',
        `👤 Клиент: ${payload.customer.name}${tgUser && tgUser.username ? ` (@${tgUser.username})` : ''}`,
        `📞 Телефон: ${payload.customer.phone}`,
        `🚚 Доставка: ${payload.customer.delivery}`
      ];
      if (payload.customer.comment) {
        lines.push(`💬 Комментарий: ${payload.customer.comment}`);
      }
      lines.push('', '📦 Состав заказа:');
      payload.items.forEach((it, idx) => {
        lines.push(`${idx + 1}. ${it.name} (SKU: ${it.id}) × ${it.qty} = ${formatPrice(it.sum)}`);
      });
      lines.push('', `💰 Итого к оплате: ${formatPrice(payload.total)}`);
      return lines.join('\n');
    }

    // Асинхронная отправка заказа в Google Apps Script и Telegram
    async function submitOrder() {
      if (state.submitting) return;

      syncCheckoutInputsToState();
      const errEl = document.getElementById('checkoutError');

      if (!state.customer.name.trim() || !state.customer.phone.trim()) {
        if (errEl) {
          errEl.textContent = 'Пожалуйста, укажите имя и телефон.';
          errEl.classList.remove('hidden');
        }
        haptic('error');
        return;
      }

      const { items, total } = getCartSummary();
      if (items.length === 0) return;

      state.submitting = true;
      renderCartModal();

      const orderId = String(Math.floor(100000 + Math.random() * 900000));
      const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

      const payload = {
        orderId,
        createdAt: new Date().toISOString(),
        customer: {
          name: state.customer.name.trim(),
          phone: state.customer.phone.trim(),
          delivery: state.customer.delivery,
          comment: state.customer.comment.trim(),
          tgUser
        },
        items,
        total,
        formattedMessage: '',
        telegramText: ''
      };

      payload.formattedMessage = buildFormattedTelegramMessage(payload);
      payload.telegramText =
        `🛒 *Новый заказ #${payload.orderId}*\n` +
        `Магазин: ${CONFIG.STORE_NAME}\n\n` +
        `👤 Клиент: ${payload.customer.name}` +
        (tgUser && tgUser.username ? ` (@${tgUser.username})` : '') +
        `\n📞 Телефон: ${payload.customer.phone}\n` +
        `🚚 Доставка: ${payload.customer.delivery}\n` +
        (payload.customer.comment ? `💬 Комментарий: ${payload.customer.comment}\n` : '') +
        `\n📦 *Состав заказа:*\n` +
        payload.items
          .map((it, idx) => `${idx + 1}. ${it.name} (SKU: ${it.id}) × ${it.qty} = ${formatPrice(it.sum)}`)
          .join('\n') +
        `\n\n💰 *Итого к оплате: ${formatPrice(payload.total)}*`;

      let statusText = 'Демо-режим (вставьте URL Google Apps Script в CONFIG.WEBHOOK_URL)';

      if (CONFIG.WEBHOOK_URL && CONFIG.WEBHOOK_URL.trim() !== '') {
        try {
          // mode: 'no-cors' + text/plain исключают CORS preflight-ошибку в Google Apps Script doPost(e)
          await fetch(CONFIG.WEBHOOK_URL.trim(), {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          statusText = 'Заказ отправлен в Telegram-группу и сохранён в таблицу';
        } catch (err) {
          console.warn('Webhook POST error:', err);
          statusText = 'Не удалось достучаться до Webhook — проверьте CONFIG.WEBHOOK_URL';
        }
      } else if (tg && tg.initData && typeof tg.sendData === 'function') {
        try {
          tg.sendData(JSON.stringify(payload));
          statusText = 'Заказ передан в Telegram-бот';
        } catch (err) {
          console.warn('tg.sendData error:', err);
        }
      }

      state.submitting = false;
      state.cart = {};
      state.lastOrder = {
        orderId,
        statusText,
        formattedMessage: payload.formattedMessage
      };
      state.cartStep = 'success';

      haptic('success');
      renderProducts();
      updateCartUI();
      renderCartModal();
    }

    // =========================================================================
    // 8. ТЕМА И ИНИЦИАЛИЗАЦИЯ СОБЫТИЙ
    // =========================================================================
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const isDark = theme === 'dark';
      els.iconSun.classList.toggle('hidden', !isDark);
      els.iconMoon.classList.toggle('hidden', isDark);
    }

    function initEvents() {
      // Переключатель темы
      els.themeToggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        applyTheme(current === 'dark' ? 'light' : 'dark');
        haptic('light');
      });

      // Поиск
      els.searchInput.addEventListener('input', (e) => {
        state.search = e.target.value;
        els.clearSearchBtn.classList.toggle('hidden', state.search.trim() === '');
        renderProducts();
      });

      els.clearSearchBtn.addEventListener('click', () => {
        state.search = '';
        els.searchInput.value = '';
        els.clearSearchBtn.classList.add('hidden');
        renderProducts();
      });

      // Сброс фильтров
      const resetAll = () => {
        state.search = '';
        state.category = 'Все';
        state.brand = 'Все';
        els.searchInput.value = '';
        els.clearSearchBtn.classList.add('hidden');
        renderFilters();
        renderProducts();
      };
      els.resetFiltersBtn.addEventListener('click', resetAll);
      els.emptyResetBtn.addEventListener('click', resetAll);

      // Клик по категориям и брендам
      els.categoryTabs.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-category]');
        if (!btn) return;
        state.category = btn.dataset.category;
        haptic('light');
        renderFilters();
        renderProducts();
      });

      els.brandPills.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-brand]');
        if (!btn) return;
        state.brand = btn.dataset.brand;
        haptic('light');
        renderFilters();
        renderProducts();
      });

      // Делегирование кликов в сетке товаров
      els.productGrid.addEventListener('click', (e) => {
        const addBtn = e.target.closest('[data-add-cart]');
        if (addBtn) {
          e.stopPropagation();
          updateCartQty(addBtn.dataset.addCart, 1);
          showToast('Товар добавлен в корзину');
          return;
        }
        const incBtn = e.target.closest('[data-inc-cart]');
        if (incBtn) {
          e.stopPropagation();
          updateCartQty(incBtn.dataset.incCart, 1);
          return;
        }
        const decBtn = e.target.closest('[data-dec-cart]');
        if (decBtn) {
          e.stopPropagation();
          updateCartQty(decBtn.dataset.decCart, -1);
          return;
        }
        if (e.target.closest('[data-stop-open]')) return;

        const card = e.target.closest('[data-open-product]');
        if (card) {
          openProductModal(card.dataset.openProduct);
        }
      });

      // Кнопки внутри футера карточки товара
      els.productModalFooter.addEventListener('click', (e) => {
        const addBtn = e.target.closest('[data-modal-add]');
        if (addBtn) {
          updateCartQty(addBtn.dataset.modalAdd, 1);
          showToast('Товар добавлен в корзину');
          return;
        }
        const incBtn = e.target.closest('[data-modal-inc]');
        if (incBtn) {
          updateCartQty(incBtn.dataset.modalInc, 1);
          return;
        }
        const decBtn = e.target.closest('[data-modal-dec]');
        if (decBtn) {
          updateCartQty(decBtn.dataset.modalDec, -1);
          return;
        }
        if (e.target.closest('#modalGoCartBtn')) {
          closeProductModal();
          openCartModal('cart');
        }
      });

      // Кнопки +/- и допродажа внутри корзины и оформления заказа
      els.cartModalBody.addEventListener('click', (e) => {
        const upsellBtn = e.target.closest('[data-upsell-add]');
        if (upsellBtn) {
          updateCartQty(upsellBtn.dataset.upsellAdd, 1);
          showToast('Удлинитель добавлен в заказ');
          return;
        }
        const incBtn = e.target.closest('[data-cart-inc]');
        if (incBtn) {
          updateCartQty(incBtn.dataset.cartInc, 1);
          return;
        }
        const decBtn = e.target.closest('[data-cart-dec]');
        if (decBtn) {
          updateCartQty(decBtn.dataset.cartDec, -1);
        }
      });

      // Открытие/закрытие модалок
      els.headerCartBtn.addEventListener('click', () => openCartModal('cart'));
      els.openCartFromBarBtn.addEventListener('click', () => openCartModal('cart'));
      els.closeProductModalBtn.addEventListener('click', closeProductModal);
      els.closeCartModalBtn.addEventListener('click', closeCartModal);

      els.productModal.addEventListener('click', (e) => {
        if (e.target === els.productModal) closeProductModal();
      });
      els.cartModal.addEventListener('click', (e) => {
        if (e.target === els.cartModal) closeCartModal();
      });
    }

    function initApp() {
      els.storeTitleEl.textContent = CONFIG.STORE_NAME;

      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (tg.colorScheme === 'light' || tg.colorScheme === 'dark') {
            applyTheme(tg.colorScheme);
          } else {
            applyTheme('dark');
          }
          if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            state.customer.name = [u.first_name, u.last_name].filter(Boolean).join(' ');
          }
          if (tg.MainButton) {
            tg.MainButton.onClick(() => openCartModal('cart'));
          }
        } catch (err) {
          console.warn('Telegram SDK init warning:', err);
          applyTheme('dark');
        }
      } else {
        applyTheme('dark');
      }

      initEvents();
      loadCatalogFromCSV(false);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
